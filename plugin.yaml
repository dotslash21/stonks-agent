name: stonks-agent
version: "1.0.0"
description: "Proactive AI Agent Plugin for Indian equities, ETFs, and direct mutual funds across Zerodha Kite, Groww, and INDmoney with official NSE data and Obsidian memory. Strictly 100% advisory-only."
author: "Antigravity Ecosystem"
license: "MIT"
homepage: "https://github.com/dotslash21/stonks-agent"

provides_hooks:
  - pre_tool_call
  - post_tool_call

provides_tools: []

skills:
  - skills/portfolio-sentinel/SKILL.md
  - skills/fundamental-valuation/SKILL.md
  - skills/nse-corporate-filings/SKILL.md
  - skills/mf-etf-health-check/SKILL.md
  - skills/obsidian-portfolio-memory/SKILL.md

requires_env:
  - name: ZERODHA_API_KEY
    description: "Zerodha Kite Connect API key for read-only portfolio sync"
    prompt: false
  - name: ZERODHA_ACCESS_TOKEN
    description: "Zerodha Kite daily authenticated access token"
    prompt: false
  - name: GROWW_AUTH_TOKEN
    description: "Groww read-only session token"
    prompt: false
  - name: INDMONEY_API_TOKEN
    description: "INDmoney read-only tracking token"
    prompt: false
  - name: ALPHA_VANTAGE_API_KEY
    description: "Alpha Vantage API key for technical indicator calculations"
    prompt: false
  - name: OBSIDIAN_API_KEY
    description: "Obsidian Local REST API bearer token"
    prompt: false
  - name: OBSIDIAN_VAULT_PATH
    description: "Local filesystem path to target Obsidian investment vault"
    prompt: false
