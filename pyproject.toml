[project]
name = "agentic-trading-setup"
version = "0.1.0"
description = "E2E Agentic Trading, Portfolio Sentinel & Risk Intelligence Setup for Indian Markets (NSE/BSE, Mutual Funds, ETFs)"
readme = "README.md"
authors = [
    { name = "Arunangshu Biswas", email = "arunangshubsws@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "httpx>=0.25.0",
    "beautifulsoup4>=4.12.0",
    "feedparser>=6.0.10",
    "yfinance>=0.2.35",
    "rich>=13.7.0"
]

[project.scripts]
portfolio-sentinel = "workflows.run_portfolio_sentinel:main"
fundamental-review = "workflows.run_fundamental_review:main"


[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
